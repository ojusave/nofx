# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# NOFX on Render — uses the existing Railway all-in-one image (Dockerfile.railway).
# Repo: https://github.com/ojusave/nofx
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo (branch: dev).
#
# Required at Apply time:
#   JWT_SECRET — openssl rand -base64 48  (min 32 bytes)
#
# Optional (recommended for production): set DATA_ENCRYPTION_KEY and RSA_PRIVATE_KEY
# in the dashboard so they survive redeploys. If omitted, railway/start.sh generates
# them on boot; save them before the next deploy or encrypted credentials break.

previews:
  generation: off

projects:
  - name: nofx
    environments:
      - name: production
        services:
          - type: web
            name: nofx
            runtime: docker
            dockerfilePath: ./Dockerfile.railway
            plan: starter
            region: oregon
            healthCheckPath: /health
            disk:
              name: nofx-data
              mountPath: /app/data
              sizeGB: 5
            envVars:
              - key: DB_TYPE
                value: sqlite
              - key: DB_PATH
                value: /app/data/data.db
              - key: TZ
                value: UTC
              - key: TRANSPORT_ENCRYPTION
                value: "false"
              - key: AI_MAX_TOKENS
                value: "8000"
              - key: JWT_SECRET
                sync: false
              - key: DATA_ENCRYPTION_KEY
                sync: false
              - key: RSA_PRIVATE_KEY
                sync: false
