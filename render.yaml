# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# NOFX on Render — uses the existing Railway all-in-one image (Dockerfile.railway).
# Repo: https://github.com/ojusave/nofx
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo (branch: dev).
#
# JWT_SECRET and DATA_ENCRYPTION_KEY are auto-generated by Render at apply time.
# RSA_PRIVATE_KEY is auto-generated on first boot by railway/start.sh if unset.
# For production, copy all three from the dashboard after first deploy so they
# survive redeploys; otherwise encrypted credentials may break after restart.

previews:
  generation: off

projects:
  - name: nofx
    environments:
      - name: production
        services:
          - type: web
            name: nofx
            runtime: docker
            dockerfilePath: ./Dockerfile.railway
            plan: starter
            region: oregon
            healthCheckPath: /health
            disk:
              name: nofx-data
              mountPath: /app/data
              sizeGB: 5
            envVars:
              - key: DB_TYPE
                value: sqlite
              - key: DB_PATH
                value: /app/data/data.db
              - key: TZ
                value: UTC
              - key: TRANSPORT_ENCRYPTION
                value: "false"
              - key: AI_MAX_TOKENS
                value: "8000"
              - key: JWT_SECRET
                generateValue: true
              - key: DATA_ENCRYPTION_KEY
                generateValue: true
